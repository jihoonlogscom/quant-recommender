<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알림 · 리포트 · 퀀트 워크스페이스</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  .toolnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
  .toolnav a{font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--line);
    background:var(--panel);padding:6px 11px;border-radius:8px;transition:.15s}
  .toolnav a:hover{color:var(--ink);border-color:var(--line-2)}
  .toolnav a[aria-current="page"]{color:var(--cyan);border-color:var(--cyan);background:rgba(67,201,193,.08)}
  .toolnav a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</head>
<body>
<div class="homebar"><a href="index.html">← 퀀트 워크스페이스</a></div>
<nav class="toolnav"><a href="daily.html">오늘의 추천</a><a href="backtest.html">검증</a><a href="factors.html">팩터</a><a href="regime.html">국면</a><a href="research.html">리서치</a><a href="screener.html">스크리너</a><a href="watchlist.html">관심</a><a href="portfolio.html">포트폴리오</a><a href="report.html" aria-current="page">리포트</a></nav>
<header class="pg">
  <div><span class="kicker">Daily Report</span><h1>알림 · 리포트</h1><div class="sub">오늘의 신호를 요약하고, 관심·보유 종목의 경고를 모아 봅니다.</div></div>
  <div class="asof"><span class="dot"></span>기준일 <b id="asof">—</b></div>
</header>

<div class="controls">
  <div class="seg mkt" id="mkt"><button data-mk="ALL" aria-pressed="true">전체</button><button data-mk="KR" aria-pressed="false">한국</button><button data-mk="US" aria-pressed="false">미국</button></div>
  <button class="btn" id="copy" style="margin-left:auto">리포트 복사</button>
</div>
<div class="card"><div class="hd">오늘의 요약</div><div class="bd" id="brief"></div></div>
<div class="cols c2" style="margin-top:12px">
  <div class="card"><div class="hd">주목할 종목</div><div class="bd" id="high"></div></div>
  <div class="card"><div class="hd">주의 신호</div><div class="bd" id="alert"></div></div>
</div>
<footer>리서치 보조용이며 투자 자문이 아닙니다. 확률·점수는 과거 데이터 기반으로 미래 수익을 보장하지 않습니다.</footer>
<script src="assets/app.js"></script>
<script>

let D,MK="ALL";
function recs(){return (D.recommendations||[]).filter(r=>MK==="ALL"||r.market===MK);}
function buildText(){
  const rs=recs(), buy=rs.filter(r=>r.signal==="buy").sort((a,b)=>b.score-a.score);
  const rg=D.market_regime||{};
  const L=[`[퀀트 워크스페이스] ${D.as_of||""} ${MK==="ALL"?"KR+US":MK} 요약`,
    `시장 국면 — 한국: ${(rg.kr||{}).state||"—"} / 미국: ${(rg.us||{}).state||"—"}`,
    `매수 ${rs.filter(r=>r.signal==="buy").length} · 관망 ${rs.filter(r=>r.signal==="watch").length} · 매도 ${rs.filter(r=>r.signal==="sell").length}`,``,
    `상위 매수 후보`];
  buy.slice(0,5).forEach((r,i)=>L.push(`${i+1}. ${r.name}(${r.ticker}) 점수 ${r.score} · 20일 ${QW.pct(r.prob_up.d20)}${r.verified?" · 검증":""} — ${r.note||""}`));
  L.push(``,`※ 리서치 보조용이며 투자 자문이 아닙니다.`);
  return L.join("\n");
}
function render(){
  const rs=recs(), rg=D.market_regime||{};
  const c={buy:0,watch:0,sell:0}; rs.forEach(r=>c[r.signal]++);
  const v=rs.filter(r=>r.verified).length;
  document.getElementById("brief").innerHTML=`
    <div class="mrow" style="margin-bottom:12px">
      <div class="m"><div class="k">매수</div><div class="v num good">${c.buy}</div></div>
      <div class="m"><div class="k">관망</div><div class="v num warn">${c.watch}</div></div>
      <div class="m"><div class="k">매도</div><div class="v num bad">${c.sell}</div></div>
      <div class="m"><div class="k">검증 통과</div><div class="v num">${v}</div></div></div>
    <div class="note">한국 <b>${QW.esc((rg.kr||{}).state||"—")}</b> · 미국 <b>${QW.esc((rg.us||{}).state||"—")}</b>
    — 20일 승률 ${QW.pct((D.backtest||{}).hit_d20)}, 과최적화 확률(PBO) ${QW.pct((D.backtest||{}).pbo)}</div>`;
  const buy=rs.filter(r=>r.signal==="buy").sort((a,b)=>b.score-a.score).slice(0,6);
  document.getElementById("high").innerHTML= buy.length? buy.map(r=>
    `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:8px;align-items:center">${QW.rowName(r)}
        <b class="num" style="margin-left:auto">${r.score}</b>
        <span class="num" style="color:var(--muted);font-size:12px">${QW.pct(r.prob_up.d20)}</span></div>
      <div class="note" style="font-size:11.5px;margin-top:4px">${QW.esc(r.note||"")}</div></div>`).join("")
    : `<div class="empty">매수 신호 종목이 없습니다</div>`;
  const sell=rs.filter(r=>r.signal==="sell").sort((a,b)=>a.score-b.score).slice(0,6);
  const wl=QW.store.get("watchlist",[]), hold=Object.keys(QW.store.get("holdings",{}));
  const mine=rs.filter(r=>{const id=r.market+":"+r.ticker; return (wl.includes(id)||hold.includes(id))&&r.signal==="sell";});
  document.getElementById("alert").innerHTML=
    (mine.length? `<div style="margin-bottom:10px"><span class="sig sell">내 종목 경고</span>
      <div class="note" style="margin-top:6px">${mine.map(r=>QW.esc(r.name)).join(", ")} — 관심/보유 중인 종목에 매도 신호</div></div>`:"")+
    (sell.length? sell.map(r=>`<div style="padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center">
      ${QW.rowName(r)}<b class="num" style="margin-left:auto;color:var(--sell)">${r.score}</b></div>`).join("")
    : `<div class="empty">주의 신호 없음</div>`);
}
document.getElementById("copy").addEventListener("click",async()=>{
  const b=document.getElementById("copy");
  try{await navigator.clipboard.writeText(buildText()); b.textContent="복사됨 ✓";}
  catch(e){b.textContent="복사 실패";}
  setTimeout(()=>b.textContent="리포트 복사",1600);});
QW.segment(document.getElementById("mkt"),ds=>{MK=ds.mk;render();});
QW.load().then(d=>{D=d;QW.header(d);render();});

</script>
</body>
</html>
