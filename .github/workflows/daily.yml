name: daily-quant

# 평일 21:30 UTC(미국 장 마감 후) 실행. 이 시점이면 당일 한국 데이터도 확정.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

env:
  # SEC EDGAR는 연락처 포함 User-Agent를 요구한다(자기 이메일로 바꾸세요)
  SEC_UA: "quant-recommender ${{ github.actor }}@users.noreply.github.com"   # SEC는 연락 이메일 포함 UA 요구
  # 한국 재무(선택): 레포 Settings→Secrets에 DART_API_KEY 등록 시 사용
  DART_API_KEY: ${{ secrets.DART_API_KEY }}
  US_UNIVERSE: "S&P500"        # 확장 시 NASDAQ / NYSE 등

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 일봉 증분 캐시 지속(러닝 간). 롤링 키로 최신 캐시를 복원.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: pit-cache-${{ github.run_id }}
          restore-keys: pit-cache-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python run.py --markets KR US --outdir docs --limit 400   # 상한(0/삭제 시 전종목)

      - name: Commit results
        run: |
          git config user.name  "quant-bot"
          git config user.email "quant-bot@users.noreply.github.com"
          git add docs
          git commit -m "data: ${{ github.run_id }} $(date -u +%Y-%m-%d)" || echo "no changes"
          git push